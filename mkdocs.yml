site_name: XenoUI
site_description: Declarative cross-platform mobile UI framework for .NET, rendered with SkiaSharp.
site_url: https://eel2000.github.io/XenoUI.Docs/
repo_url: https://github.com/Eel2000/XenoUI.Docs
repo_name: Eel2000/XenoUI.Docs
edit_uri: https://github.com/Eel2000/XenoUI.Docs/edit/main/docs/
copyright: Copyright &copy; XenoUI contributors — BSL-1.0

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Framework UI mobile déclaratif et multiplateforme pour .NET, rendu avec SkiaSharp.
          nav_translations:
            Home: Accueil
            Get started: Démarrer
            Guides: Guides
            Architecture: Architecture
            Media: Média
            Performance: Performance
            History: Historique
  - macros:
      on_undefined: strict

extra:
  # Current XenoUI release, used in pages as {{ xeno_version }}.
  xeno_version: 0.1.0-preview.5

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors (accents kept), so links written for GitHub keep working.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Get started:
      - installation.md
      - developer-guide.md
      - troubleshooting.md
  - Guides:
      - xeno-sdk.md
      - visual-studio.md
      - vscode.md
      - navigation-scaffold.md
      - text-layout-navigation.md
      - sample-api.md
  - Architecture:
      - architecture/index.md
      - architecture/runtime.md
      - architecture/navigation-and-scenes.md
      - architecture/text-input-and-native.md
      - architecture/tooling-and-platforms.md
      - architecture/decisions-v1.md
      - android-graphics-lifecycle.md
  - Media:
      - media-controller.md
      - media-playback-implementation.md
  - Performance:
      - runtime-benchmark-a15.md
      - runtime-benchmark.md
      - runtime-critical-stabilization.md
  - History:
      - sdk-and-project-setup.md
      - flutter-style-text-input.md
      - text-input-implementation.md
      - architecture.md
      - app-lifecycle.md
      - v1-roadmap-and-architecture.md
